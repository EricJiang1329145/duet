<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
  <title id="title">Deploy flow</title>
  <desc id="desc">Fork or clone, create seat hashes, configure Wrangler, deploy assets and Worker, then log in.</desc>
  <rect width="1000" height="250" fill="#f7efe2"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">
    <text x="42" y="45" fill="#2d3b31" font-size="21" font-weight="700">Deploy your own copy · 部署自己的小院</text>
    <text x="42" y="68" fill="#657166" font-size="12">No build step. Five small steps.</text>
    <g fill="#fff9ee" stroke="#d9c9ad">
      <rect x="42" y="105" width="170" height="82" rx="14"/>
      <rect x="242" y="105" width="170" height="82" rx="14"/>
      <rect x="442" y="105" width="170" height="82" rx="14"/>
      <rect x="642" y="105" width="170" height="82" rx="14"/>
      <rect x="842" y="105" width="116" height="82" rx="14"/>
    </g>
    <g fill="#2d3b31" font-size="13" font-weight="700">
      <text x="62" y="137">1 · Clone</text>
      <text x="262" y="137">2 · Secrets</text>
      <text x="462" y="137">3 · Wrangler</text>
      <text x="662" y="137">4 · Deploy</text>
      <text x="862" y="137">5 · Login</text>
    </g>
    <g fill="#657166" font-size="10.5">
      <text x="62" y="159">fork / git clone</text>
      <text x="262" y="159">seat hashes +</text>
      <text x="262" y="173">session secret</text>
      <text x="462" y="159">edit name +</text>
      <text x="462" y="173">wrangler.jsonc</text>
      <text x="662" y="159">sync-public.sh</text>
      <text x="662" y="173">wrangler deploy</text>
      <text x="862" y="159">/hash →</text>
      <text x="862" y="173">/login</text>
    </g>
    <g stroke="#b96545" stroke-width="2" fill="none">
      <path d="M212 146 L242 146"/><path d="M412 146 L442 146"/>
      <path d="M612 146 L642 146"/><path d="M812 146 L842 146"/>
    </g>
    <text x="42" y="225" fill="#657166" font-size="11">Optional: bind a custom domain in worker/wrangler.jsonc → routes, then deploy again.</text>
  </g>
</svg>
